# RebelDesk coturn configuration.
# Every option that matters for a self-hosted deployment is listed here.
# The commented-out lines are the ones you MUST review before exposing coturn
# on the public internet.

# Listen on both STUN (3478) and TURN over TLS (5349).
listening-port=3478
tls-listening-port=5349

# ---- WAN configuration ----
# Uncomment and set these to the public IP your STUN/TURN clients will reach.
# external-ip=203.0.113.10
# realm=turn.your-domain.example

# ---- Relay port range (UDP) ----
# Match the port range you publish in docker-compose.yml.
min-port=49160
max-port=49200

# ---- Authentication ----
# RebelDesk uses time-limited HMAC-SHA1 credentials (draft-uberti-behave-turn-rest-00 /
# RFC 7635 style). The server's REBELDESK_TURN_SECRET must equal this static-auth-secret.
use-auth-secret
static-auth-secret=dev-only-turn-secret-CHANGE

# ---- Hardening ----
# Deny access to link-local, private, and metadata ranges. Prevents the relay from being
# used as an outbound proxy into the operator's private network.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# ---- Logging ----
log-file=stdout
no-stdout-log=false
simple-log
verbose

# ---- Performance limits ----
# Adjust these once you have real traffic.
total-quota=200
user-quota=20

# ---- TLS (uncomment once you have certificates) ----
# cert=/etc/letsencrypt/live/turn.your-domain.example/fullchain.pem
# pkey=/etc/letsencrypt/live/turn.your-domain.example/privkey.pem

# ---- CLI (disabled by default) ----
no-cli
